name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Init Signature
        run: |
          cd android
          touch key.properties
          echo storePassword='${{ secrets.STORE_PASSWORD }}' >> key.properties
          echo keyPassword='${{ secrets.KEY_PASSWORD }}' >> key.properties
          echo keyAlias='${{ secrets.KEY_ALIAS }}' >> key.properties
          echo storeFile='../key.jks' >> key.properties
          # 从 Secrets 读取无换行符 Base64 解码，然后保存到到 key.jks
          # 使用 tr -d '\n' 移除所有换行符和空白字符后再解码
          echo '${{ secrets.KEY_STORE }}' | tr -d '\n\r ' | base64 --decode > $GITHUB_WORKSPACE/android/key.jks
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '23'
      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.29.3
      # download aar
      - uses: robinraju/release-downloader@v1
        with:
          repository: 'OpenListApp/OpenListLib'
          latest: true
          fileName: 'mobile.aar'
          out-file-path: 'openlist_background_service/android/libs'
      - run: flutter pub get
      - run: flutter build apk --release
      - run: flutter build apk --split-per-abi --release
      - name: Release APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ./build/app/outputs/flutter-apk/*.apk
